# Every push to main that touches the game publishes a new build.
# The launcher reads releases/latest/download/latest.json, downloads the .pck it names,
# deletes older builds and starts the game.
name: Release game build

on:
  push:
    branches: [main]
    paths: ["game/**", ".github/workflows/release-game.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Export game pack
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "$VERSION" > game/version.txt
          ./godot --headless --path game --import || true
          mkdir -p out
          ./godot --headless --path game --export-pack Linux "$PWD/out/IronAdvance-$VERSION.pck"
          test -s "out/IronAdvance-$VERSION.pck"

      - name: Write manifest
        run: |
          PCK="IronAdvance-$VERSION.pck"
          SHA=$(sha256sum "out/$PCK" | cut -d' ' -f1)
          NOTES=$(git log -1 --pretty=%s | head -c 120 | sed 's/"/\\"/g')
          cat > out/latest.json <<JSON
          {"version": "$VERSION", "pck": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/$PCK", "sha256": "$SHA", "engine": "${GODOT_VERSION}", "notes": "$NOTES", "launcher_url": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/launcher"}
          JSON
          cat out/latest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" out/IronAdvance-$VERSION.pck out/latest.json \
            --title "Build $VERSION" --notes "$(git log -1 --pretty=%B)" --latest
